name: Playwright Tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  VENUE: ${{ vars.VENUE || 'default' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps

      - name: Resolve CSC_ID
        shell: bash
        run: |
          if [[ "$VENUE" == "Bangalore" ]]; then
            CSC_ID="CSC-BLR"
          elif [[ "$VENUE" == "Mumbai" ]]; then
            CSC_ID="CSC-MUM"
          elif [[ "$VENUE" == "Hyderabad" ]]; then
            CSC_ID="CSC-HYD"
          elif [[ "$VENUE" == "Delhi" ]]; then
            CSC_ID="CSC-DEL"
          elif [[ "$VENUE" == "Chennai" ]]; then
            CSC_ID="CSC-CHE"
          else
            CSC_ID="CSC-DEFAULT"
          fi

          echo "CSC_ID=$CSC_ID" >> "$GITHUB_ENV"
          echo "Resolved CSC_ID=$CSC_ID for VENUE=$VENUE"

      - name: Run Playwright tests
        # We inject the resolved environment variables here along with the global CI indicator
        env:
          CSC_ID: ${{ env.CSC_ID }}
          CI: true
        # Adding --headless forces it to override any local configuration files
        run: npx playwright test --headless

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: warn
